<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MJO 中西爵士大樂團・團練出席</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #F8CEC3;
    --gold-light: #FDE8E4;
    --ink: #B9DFD1;
    --ink-mid: #4A4540;
    --ink-soft: #8A847C;
    --ink-faint: #C8C2BA;
    --cream: #F9F6F0;
    --white: #FFFFFF;
    --present-bg: #EEF6EE;
    --present-text: #2D6A2D;
    --absent-bg: #FDF0EE;
    --absent-text: #8A3020;
    --special-bg: #EEF2FA;
    --special-text: #2A4080;
    --radius: 12px;
    --radius-sm: 6px;
  }

  body {
    font-family: -apple-system, 'Noto Sans TC', sans-serif;
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
  }

  /* HEADER */
  .site-header {
    background: var(--ink);
    padding: 24px 20px 20px;
    text-align: center;
    position: relative;
  }
  .site-header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--gold);
  }
  .band-name {
    font-size: 20px;
    font-weight: 600;
    color: #1A1714;
    letter-spacing: 0.06em;
  }
  .band-sub {
    font-size: 11px;
    color: #1A1714;
    letter-spacing: 0.18em;
    margin-top: 4px;
    opacity: 0.65;
  }

  /* FORM BANNER */
  .form-banner {
    background: var(--gold);
    padding: 11px 20px;
    text-align: center;
  }
  .form-banner a {
    color: #1A1714;
    font-size: 13px;
    font-weight: 500;
    text-decoration: none;
    letter-spacing: 0.04em;
  }

  /* TAB BAR */
  .tab-bar {
    display: flex;
    background: var(--white);
    border-bottom: 1px solid #EDE8E0;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .tab-btn {
    flex: 1;
    padding: 14px 8px;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-soft);
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    font-family: inherit;
    transition: color 0.2s, border-color 0.2s;
    letter-spacing: 0.04em;
  }
  .tab-btn.active {
    color: var(--ink);
    border-bottom-color: var(--gold);
  }

  /* MAIN */
  .main { max-width: 600px; margin: 0 auto; padding: 16px 14px 60px; }

  /* STATUS */
  .status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .status-text { font-size: 11px; color: var(--ink-soft); }
  .refresh-btn {
    background: none;
    border: 1px solid var(--ink-faint);
    border-radius: 99px;
    padding: 3px 12px;
    font-size: 11px;
    color: var(--ink-soft);
    cursor: pointer;
    font-family: inherit;
  }
  .refresh-btn:active { opacity: 0.6; }

  /* LOADING */
  .loading {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-soft);
    font-size: 14px;
  }
  .spinner {
    width: 26px; height: 26px;
    border: 2px solid var(--ink-faint);
    border-top-color: var(--gold);
    border-radius: 50%;
    margin: 0 auto 14px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* SEASON LABEL */
  .season-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.18em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 10px;
    margin-top: 20px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--gold-light);
  }
  .season-label:first-child { margin-top: 0; }

  /* SESSION CARD */
  .session-card {
    background: var(--white);
    border-radius: var(--radius);
    border: 1px solid #EDE8E0;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .card-header {
    display: flex;
    align-items: center;
    padding: 13px 16px;
    cursor: pointer;
    gap: 10px;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .card-date {
    font-size: 17px;
    font-weight: 600;
    color: var(--ink);
    min-width: 56px;
  }
  .card-day {
    font-size: 12px;
    color: var(--ink-soft);
    margin-right: auto;
  }
  .pills { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
  .pill {
    font-size: 11px;
    padding: 2px 9px;
    border-radius: 99px;
    font-weight: 500;
    white-space: nowrap;
  }
  .pill-present { background: var(--present-bg); color: var(--present-text); }
  .pill-absent { background: var(--absent-bg); color: var(--absent-text); }
  .pill-special { background: var(--special-bg); color: var(--special-text); }
  .pill-none { background: #F5F2EE; color: #8A847C; }
  .chevron {
    font-size: 11px;
    color: var(--ink-faint);
    transition: transform 0.22s;
    flex-shrink: 0;
    margin-left: 4px;
  }
  .session-card.open .chevron { transform: rotate(180deg); }

  /* CARD BODY */
  .card-body {
    display: none;
    padding: 0 16px 14px;
    border-top: 1px solid #F0EBE3;
  }
  .session-card.open .card-body { display: block; }

  .list-block { margin-top: 12px; }
  .list-title {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: var(--ink-soft);
    margin-bottom: 7px;
    text-transform: uppercase;
  }
  .chip-row { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 5px 10px;
    border-radius: var(--radius-sm);
    font-size: 13px;
  }
  .chip-p { background: var(--present-bg); color: var(--present-text); }
  .chip-a { background: var(--absent-bg); color: var(--absent-text); }
  .chip-s { background: var(--special-bg); color: var(--special-text); }
  .chip-inst { font-size: 10px; opacity: 0.65; }
  .chip-note { font-size: 11px; opacity: 0.75; }

  .no-data {
    font-size: 13px;
    color: var(--ink-soft);
    padding: 10px 0 4px;
  }

  .empty-state {
    text-align: center;
    padding: 50px 20px;
    color: var(--ink-soft);
    font-size: 14px;
  }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
</style>
</head>
<body>

<header class="site-header">
  <div class="band-name">MJO 中西爵士大樂團</div>
  <div class="band-sub">團練出席狀況</div>
</header>

<div class="form-banner">
  <a href="https://forms.gle/iDZMPP3zgLKFrrTf9" target="_blank">✎ 點此填寫請假登記表單</a>
</div>

<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('tuesday')">週二團</button>
  <button class="tab-btn" onclick="switchTab('sunday')">週日團</button>
</div>

<main class="main">
  <div class="status-row">
    <span class="status-text" id="status-text">讀取中…</span>
    <button class="refresh-btn" onclick="loadData()">重新整理</button>
  </div>

  <div id="panel-tuesday" class="tab-panel active">
    <div class="loading"><div class="spinner"></div>載入中…</div>
  </div>
  <div id="panel-sunday" class="tab-panel">
    <div class="loading"><div class="spinner"></div>載入中…</div>
  </div>
</main>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbz8dn1QM4oIQOFGp97-MSySKm1q-VYAUbjtkr9Qg8u7goJvekM2plfSdw8X8kjFjH_M/exec';
let currentTab = 'tuesday';
let allData = [];

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', (i === 0 && tab === 'tuesday') || (i === 1 && tab === 'sunday'));
  });
  document.getElementById('panel-tuesday').classList.toggle('active', tab === 'tuesday');
  document.getElementById('panel-sunday').classList.toggle('active', tab === 'sunday');
}

async function loadData() {
  document.getElementById('status-text').textContent = '讀取中…';
  ['tuesday','sunday'].forEach(t => {
    document.getElementById('panel-' + t).innerHTML = '<div class="loading"><div class="spinner"></div>載入中…</div>';
  });

  try {
    const res = await fetch(API_URL + '?t=' + Date.now());
    allData = await res.json();
    if (allData.error) throw new Error(allData.error);
  } catch(e) {
    ['tuesday','sunday'].forEach(t => {
      document.getElementById('panel-' + t).innerHTML =
        '<div class="empty-state">資料載入失敗，請稍後再試</div>';
    });
    document.getElementById('status-text').textContent = '載入失敗';
    return;
  }

  renderPanel('tuesday');
  renderPanel('sunday');

  const now = new Date();
  document.getElementById('status-text').textContent =
    `更新：${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
}

function renderPanel(groupType) {
  const panel = document.getElementById('panel-' + groupType);
  const sessions = allData.filter(s => s.groupType === groupType);

  if (!sessions.length) {
    panel.innerHTML = '<div class="empty-state">目前沒有即將到來的場次</div>';
    return;
  }

  // 按季分組
  const bySeason = {};
  sessions.forEach(s => {
    const key = s.season || s.group;
    if (!bySeason[key]) bySeason[key] = [];
    bySeason[key].push(s);
  });

  let html = '';
  Object.entries(bySeason).forEach(([season, list]) => {
    html += `<div class="season-label">${season}</div>`;
    list.forEach((s, i) => {
      const cardId = groupType + '-' + i;
      const totalSpecial = s.audition.length + s.guest.length;
      const dateParts = s.date.split('/');
      const displayDate = parseInt(dateParts[1]) + '/' + parseInt(dateParts[2]);

      html += `<div class="session-card" id="${cardId}">
        <div class="card-header" onclick="toggleCard('${cardId}')">
          <span class="card-date">${displayDate}</span>
          <span class="card-day">（${s.dayOfWeek}）</span>
          <div class="pills">
            ${s.present.length ? `<span class="pill pill-present">出席 ${s.present.length}</span>` : ''}
            ${s.absent.length ? `<span class="pill pill-absent">請假 ${s.absent.length}</span>` : ''}
            ${totalSpecial ? `<span class="pill pill-special">特別 ${totalSpecial}</span>` : ''}
            ${!s.present.length && !s.absent.length && !totalSpecial ? `<span class="pill pill-none">尚無資料</span>` : ''}
          </div>
          <span class="chevron">▾</span>
        </div>
        <div class="card-body">
          ${renderBody(s)}
        </div>
      </div>`;
    });
  });

  panel.innerHTML = html;

  // 預設展開第一張
  const first = panel.querySelector('.session-card');
  if (first) first.classList.add('open');
}

function renderBody(s) {
  let html = '';

  if (s.present.length) {
    html += `<div class="list-block">
      <div class="list-title">出席</div>
      <div class="chip-row">`;
    s.present.forEach(m => {
      html += `<div class="chip chip-p">
        <span class="chip-inst">${m.instrument}</span>
        <span>${m.name}</span>
      </div>`;
    });
    html += `</div></div>`;
  }

  if (s.absent.length) {
    html += `<div class="list-block">
      <div class="list-title">請假</div>
      <div class="chip-row">`;
    s.absent.forEach(m => {
      html += `<div class="chip chip-a">
        <span class="chip-inst">${m.instrument}</span>
        <span>${m.name}</span>
        ${m.note ? `<span class="chip-note">・${m.note}</span>` : ''}
      </div>`;
    });
    html += `</div></div>`;
  }

  if (s.audition.length) {
    html += `<div class="list-block">
      <div class="list-title">試聽</div>
      <div class="chip-row">`;
    s.audition.forEach(m => {
      html += `<div class="chip chip-s"><span>${m.name}</span></div>`;
    });
    html += `</div></div>`;
  }

  if (s.guest.length) {
    html += `<div class="list-block">
      <div class="list-title">協演</div>
      <div class="chip-row">`;
    s.guest.forEach(m => {
      html += `<div class="chip chip-s"><span>${m.name}</span></div>`;
    });
    html += `</div></div>`;
  }

  if (!s.present.length && !s.absent.length && !s.audition.length && !s.guest.length) {
    html += `<div class="no-data">尚無請假紀錄，預設全員出席</div>`;
  }

  return html;
}

function toggleCard(id) {
  document.getElementById(id).classList.toggle('open');
}

loadData();
</script>

<footer style="text-align:center; padding: 32px 20px 40px; border-top: 1px solid #EDE8E0; margin-top: 8px;">
  <div style="font-size: 11px; color: #8A847C; letter-spacing: 0.12em; margin-bottom: 16px;">MJO 中西爵士大樂團</div>
  <div style="display: flex; justify-content: center; gap: 16px; flex-wrap: wrap;">
    <a href="https://portaly.cc/midwestjazz" target="_blank"
      style="display:inline-flex; align-items:center; gap:6px; padding: 9px 18px; background:#F9F6F0; border: 1px solid #EDE8E0; border-radius: 99px; font-size:13px; color:#1A1714; text-decoration:none; font-family:inherit;">
      🎷 MJO 傳送門
    </a>
    <a href="https://lin.ee/d3ET8v2" target="_blank"
      style="display:inline-flex; align-items:center; gap:6px; padding: 9px 18px; background:#F9F6F0; border: 1px solid #EDE8E0; border-radius: 99px; font-size:13px; color:#1A1714; text-decoration:none; font-family:inherit;">
      💬 MJO Line 官方帳號
    </a>
  </div>
</footer>
</body>
</html>
